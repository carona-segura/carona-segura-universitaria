name: Deploy Backend - Carona Segura

on:
  push:
    branches: [main]
    paths:
      - 'ms-usuarios/**'
      - 'ms-viagens/**'
      - 'ms-notificacoes/**'

jobs:
  deploy-ms-usuarios:
    name: Deploy MS-Usuarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MS-Usuarios
        working-directory: ./ms-usuarios
        run: ./mvnw clean package -DskipTests -B
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_DB_USERNAME: ${{ secrets.NEON_DB_USERNAME }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_USUARIOS }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

  deploy-ms-viagens:
    name: Deploy MS-Viagens
    runs-on: ubuntu-latest
    needs: deploy-ms-usuarios
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MS-Viagens
        working-directory: ./ms-viagens
        run: ./mvnw clean package -DskipTests -B
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_DB_USERNAME: ${{ secrets.NEON_DB_USERNAME }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_VIAGENS }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

  deploy-ms-notificacoes:
    name: Deploy MS-Notificacoes
    runs-on: ubuntu-latest
    needs: deploy-ms-viagens
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MS-Notificacoes
        working-directory: ./ms-notificacoes
        run: ./mvnw clean package -DskipTests -B
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_DB_USERNAME: ${{ secrets.NEON_DB_USERNAME }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_NOTIFICACOES }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
