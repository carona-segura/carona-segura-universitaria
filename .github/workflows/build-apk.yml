name: Build Flutter APK - Carona Segura

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'

      - name: Get Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Rename APK
        run: mv mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/carona-segura.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Carona Segura v${{ github.run_number }}"
          body: |
            ## Carona Segura Universitária

            Baixe o APK abaixo e instale no seu celular Android.

            > Habilite "Fontes desconhecidas" nas configurações do celular antes de instalar.
          files: mobile/build/app/outputs/flutter-apk/carona-segura.apk
          draft: false
          prerelease: false
